name: Create New Images
run-name: >-
  ${{ inputs.operation }} / ${{ inputs.app }} ${{ inputs.version }} /
  ${{ inputs.os_version }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Explicit phase-one operation"
        required: true
        type: choice
        default: pipeline_smoke
        options:
          - pipeline_smoke
          - validate_only
          - existing_as_new_probe
          - scenario_one
          - resume_round
          - resume_package
          - recover_package
          - fork_pr
          - fork_pr_resume
          - failure_issue_contract_test
      source_run_id:
        description: "Resume Run ID, or Issue number as issue:<number>"
        required: false
        type: string
      resume_from_round:
        description: "Round that resume_round restarts from (1-4)"
        required: false
        default: "1"
        type: string
      generation_run_id:
        description: "Generation run ID required by recover_package"
        required: false
        type: string
      validated_run_id:
        description: "Candidate run ID required by fork_pr operations"
        required: false
        type: string
      app:
        description: "Application name"
        required: true
        type: string
        default: kvrocks
      version:
        description: "Application version"
        required: true
        type: string
        default: 2.16.0
      os_version:
        description: "openEuler version"
        required: true
        type: string
        default: 24.03-lts-sp4
      domain:
        description: "Target repository domain"
        required: true
        type: string
        default: Database
      source_url:
        description: "Pinned upstream release URL"
        required: true
        type: string
        default: https://github.com/apache/kvrocks/tree/v2.16.0

permissions:
  actions: read
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# TODO(production-duplicate-pr-guard): test fork_pr intentionally skips
# duplicate PR handling. Before production rollout, remove this test-only
# behavior and require production/direct_branch_pr with its duplicate PR guard.

jobs:
  prepare:
    name: Prepare round 1 candidate
    if: >-
      ${{ inputs.operation == 'pipeline_smoke' ||
          inputs.operation == 'validate_only' ||
          inputs.operation == 'existing_as_new_probe' ||
          inputs.operation == 'scenario_one' }}
    runs-on: ubuntu-latest
    # Leaves headroom around the bounded Creator/QA calls for deterministic
    # gates, report writing and candidate packaging.
    timeout-minutes: 360
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up control tooling
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          python-version: "3.11"
          arch: x86_64

      - name: Normalize TaskSpec
        env:
          OPERATION: ${{ inputs.operation }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          OS_VERSION: ${{ inputs.os_version }}
          DOMAIN: ${{ inputs.domain }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          target_app="${APP}"
          if [ "${OPERATION}" = "existing_as_new_probe" ]; then
            target_app="${APP}-e2e-test"
          fi
          mkdir -p "${RUNNER_TEMP}/phase1-prepare"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            task-spec \
            --app "${target_app}" \
            --version "${VERSION}" \
            --os-version "${OS_VERSION}" \
            --domain "${DOMAIN}" \
            --source-url "${SOURCE_URL}" \
            --output "${RUNNER_TEMP}/phase1-prepare/task-spec.json"

      - name: Clone target repository
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            target-clone \
            --source \
              https://gitcode.com/openeuler/openeuler-docker-images.git \
            --destination "${RUNNER_TEMP}/phase1-target" \
            --branch master

      - name: Record target base commit
        id: base
        run: |
          base_sha="$(git -C "${RUNNER_TEMP}/phase1-target" rev-parse HEAD)"
          printf '%s\n' "${base_sha}" \
            > "${RUNNER_TEMP}/phase1-prepare/base-sha.txt"
          printf 'sha=%s\n' "${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Hide existing app for probe
        if: ${{ inputs.operation == 'existing_as_new_probe' }}
        env:
          SOURCE_APP: ${{ inputs.app }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          workspace="${RUNNER_TEMP}/phase1-target"
          relative="${DOMAIN}/${SOURCE_APP}"
          reference="${workspace}/${relative}"
          hidden="${RUNNER_TEMP}/phase1-hidden-reference"
          state="${RUNNER_TEMP}/phase1-prepare/hidden-reference-paths.bin"

          if [ ! -d "${reference}" ]; then
            echo "probe reference does not exist: ${relative}" >&2
            exit 2
          fi
          if [ -e "${hidden}" ]; then
            echo "probe hidden reference already exists" >&2
            exit 2
          fi
          git -C "${workspace}" ls-files -z -- "${relative}" > "${state}"
          if [ ! -s "${state}" ]; then
            echo "probe reference has no tracked files: ${relative}" >&2
            exit 2
          fi
          xargs -0 git -C "${workspace}" update-index --skip-worktree -- \
            < "${state}"
          mv "${reference}" "${hidden}"
          if [ -n "$(git -C "${workspace}" status --porcelain -- "${relative}")" ]; then
            echo "probe reference is still visible to the working tree" >&2
            exit 2
          fi

      - name: Apply existing-as-new context
        if: ${{ inputs.operation == 'existing_as_new_probe' }}
        uses: ./.github/actions/phase1-existing-as-new-context
        with:
          canonical-app: ${{ inputs.app }}
          target-alias: ${{ inputs.app }}-e2e-test

      - name: Generate candidate via agent
        if: >-
          ${{ inputs.operation == 'validate_only' ||
              inputs.operation == 'existing_as_new_probe' ||
              inputs.operation == 'scenario_one' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-generate \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --task-spec "${RUNNER_TEMP}/phase1-prepare/task-spec.json" \
            --base-sha "${{ steps.base.outputs.sha }}" \
            --report-dir \
              "${RUNNER_TEMP}/phase1-prepare/generation-reports" \
            --opencode "${{ steps.tools.outputs.opencode_path }}" \
            --hadolint "${{ steps.tools.outputs.hadolint_path }}"

      - name: Restore existing app after probe
        if: >-
          ${{ always() &&
              inputs.operation == 'existing_as_new_probe' }}
        env:
          SOURCE_APP: ${{ inputs.app }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          workspace="${RUNNER_TEMP}/phase1-target"
          relative="${DOMAIN}/${SOURCE_APP}"
          reference="${workspace}/${relative}"
          hidden="${RUNNER_TEMP}/phase1-hidden-reference"
          collision="${RUNNER_TEMP}/phase1-probe-reference-collision"
          state="${RUNNER_TEMP}/phase1-prepare/hidden-reference-paths.bin"
          restore_status=0

          if [ -d "${hidden}" ]; then
            if [ -e "${reference}" ]; then
              mv "${reference}" "${collision}"
              echo "probe recreated the hidden reference path" >&2
              restore_status=2
            fi
            mv "${hidden}" "${reference}" || restore_status=2
          fi
          if [ -s "${state}" ]; then
            xargs -0 git -C "${workspace}" update-index \
              --no-skip-worktree -- < "${state}" || restore_status=2
          else
            echo "probe restore state is missing" >&2
            restore_status=2
          fi
          if [ ! -d "${reference}" ]; then
            echo "probe failed to restore ${relative}" >&2
            restore_status=2
          elif [ -n "$(git -C "${workspace}" status --porcelain -- "${relative}")" ]; then
            echo "restored reference differs from the target base" >&2
            restore_status=2
          fi
          exit "${restore_status}"

      - name: Create deterministic smoke candidate
        if: ${{ inputs.operation == 'pipeline_smoke' }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-smoke-generate \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --task-spec "${RUNNER_TEMP}/phase1-prepare/task-spec.json" \
            --base-sha "${{ steps.base.outputs.sha }}" \
            --report-dir \
              "${RUNNER_TEMP}/phase1-prepare/generation-reports"

      - name: Lint generated Dockerfile
        if: ${{ inputs.operation == 'pipeline_smoke' }}
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          OS_VERSION: ${{ inputs.os_version }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          lint_report="${RUNNER_TEMP}/phase1-prepare/generation-reports/hadolint.txt"
          lint_status=0
          "${{ steps.tools.outputs.hadolint_path }}" \
            "${RUNNER_TEMP}/phase1-target/${DOMAIN}/${APP}/${VERSION}/${OS_VERSION}/Dockerfile" \
            > "${lint_report}" 2>&1 || lint_status=$?
          cat "${lint_report}"
          printf 'Hadolint advisory exit status: %s\n' "${lint_status}"

      - name: Create generation patch
        uses: ./.github/actions/phase1-emit-patch
        with:
          workspace: ${{ runner.temp }}/phase1-target
          input-dir: ${{ runner.temp }}/phase1-prepare
          output-dir: ${{ runner.temp }}/phase1-prepare

      - name: Create failure diagnostic patch
        if: ${{ failure() && steps.base.outputs.sha != '' }}
        continue-on-error: true
        uses: ./.github/actions/phase1-emit-patch
        with:
          workspace: ${{ runner.temp }}/phase1-target
          input-dir: ${{ runner.temp }}/phase1-prepare
          output-dir: ${{ runner.temp }}/phase1-prepare
          tolerate-missing: "true"

      - name: Stage round 1 candidate
        run: |
          mkdir -p "${RUNNER_TEMP}/phase1-patch1"
          cp "${RUNNER_TEMP}/phase1-prepare/task-spec.json" \
            "${RUNNER_TEMP}/phase1-prepare/base-sha.txt" \
            "${RUNNER_TEMP}/phase1-prepare/changes.patch" \
            "${RUNNER_TEMP}/phase1-patch1/"

      - name: Upload round 1 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-patch1-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-patch1/
          if-no-files-found: error
          retention-days: 30

      - name: Upload generation artifact
        if: ${{ always() && steps.base.outputs.sha != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-prepare/
          if-no-files-found: error
          retention-days: 30

  seed-resume:
    name: Seed resumed run artifacts
    if: ${{ inputs.operation == 'resume_round' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate resume inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RESUME_ROUND: ${{ inputs.resume_from_round }}
        run: |
          case "${SOURCE_RUN_ID}" in
            ''|*[!0-9]*|0) echo "source_run_id must be a positive integer" >&2; exit 2 ;;
          esac
          case "${RESUME_ROUND}" in
            1|2|3|4) ;;
            *) echo "resume_from_round must be 1, 2, 3 or 4" >&2; exit 2 ;;
          esac

      - name: Download source round candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: >-
            phase1-patch${{ inputs.resume_from_round }}-${{
            inputs.source_run_id }}
          path: ${{ runner.temp }}/phase1-seed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Download source generation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-generation-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/phase1-seed-generation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Republish candidate for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: >-
            phase1-patch${{ inputs.resume_from_round }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-seed/
          if-no-files-found: error
          retention-days: 30

      - name: Republish generation evidence for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-seed-generation/
          if-no-files-found: error
          retention-days: 30

      - name: Download round 1 decision evidence
        id: source_decision1
        if: ${{ inputs.resume_from_round != '1' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-decide1-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/phase1-seed-decisions/round1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Record missing round 1 decision
        if: ${{ inputs.resume_from_round != '1' }}
        run: |
          if [ "${{ steps.source_decision1.outcome }}" != "success" ]; then
            mkdir -p "${RUNNER_TEMP}/phase1-seed-decisions/round1"
            printf \
              '{"schema_version":1,"kind":"missing-source-decision","round":1,"source_run_id":"%s"}\n' \
              "${{ inputs.source_run_id }}" \
              > "${RUNNER_TEMP}/phase1-seed-decisions/round1/missing-source-decision-round1.json"
          fi

      - name: Republish round 1 decision evidence
        if: ${{ inputs.resume_from_round != '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-decide1-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-seed-decisions/round1/
          if-no-files-found: error
          retention-days: 30

      - name: Download round 2 decision evidence
        id: source_decision2
        if: >-
          ${{ inputs.resume_from_round == '3' || inputs.resume_from_round == '4' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-decide2-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/phase1-seed-decisions/round2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Record missing round 2 decision
        if: >-
          ${{ inputs.resume_from_round == '3' || inputs.resume_from_round == '4' }}
        run: |
          if [ "${{ steps.source_decision2.outcome }}" != "success" ]; then
            mkdir -p "${RUNNER_TEMP}/phase1-seed-decisions/round2"
            printf \
              '{"schema_version":1,"kind":"missing-source-decision","round":2,"source_run_id":"%s"}\n' \
              "${{ inputs.source_run_id }}" \
              > "${RUNNER_TEMP}/phase1-seed-decisions/round2/missing-source-decision-round2.json"
          fi

      - name: Republish round 2 decision evidence
        if: >-
          ${{ inputs.resume_from_round == '3' || inputs.resume_from_round == '4' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-decide2-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-seed-decisions/round2/
          if-no-files-found: error
          retention-days: 30

      - name: Download round 3 decision evidence
        id: source_decision3
        if: ${{ inputs.resume_from_round == '4' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-decide3-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/phase1-seed-decisions/round3
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Record missing round 3 decision
        if: ${{ inputs.resume_from_round == '4' }}
        run: |
          if [ "${{ steps.source_decision3.outcome }}" != "success" ]; then
            mkdir -p "${RUNNER_TEMP}/phase1-seed-decisions/round3"
            printf \
              '{"schema_version":1,"kind":"missing-source-decision","round":3,"source_run_id":"%s"}\n' \
              "${{ inputs.source_run_id }}" \
              > "${RUNNER_TEMP}/phase1-seed-decisions/round3/missing-source-decision-round3.json"
          fi

      - name: Republish round 3 decision evidence
        if: ${{ inputs.resume_from_round == '4' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-decide3-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-seed-decisions/round3/
          if-no-files-found: error
          retention-days: 30

  round-1:
    name: "Round 1: validate and fix"
    needs: [prepare, seed-resume]
    if: >-
      ${{ always() &&
          ((needs.prepare.result == 'success') ||
           (needs.seed-resume.result == 'success' &&
            inputs.resume_from_round == '1')) }}
    uses: ./.github/workflows/_create_new_image_rounds.yml
    with:
      round: "1"
      operation: ${{ inputs.operation }}
      max_rounds: ${{ inputs.operation == 'pipeline_smoke' && '0' || '3' }}
      next_round: "2"
      canonical_app: >-
        ${{ inputs.operation == 'existing_as_new_probe' && inputs.app || '' }}
      target_alias: >-
        ${{ inputs.operation == 'existing_as_new_probe' &&
            format('{0}-e2e-test', inputs.app) || '' }}
    secrets:
      DEEPSEEK_API_KEY: >-
        ${{ inputs.operation != 'pipeline_smoke' &&
        secrets.DEEPSEEK_API_KEY || '' }}

  round-2:
    name: "Round 2: validate and fix"
    needs: [round-1, seed-resume]
    if: >-
      ${{ always() &&
          ((needs.round-1.result == 'success' &&
            needs.round-1.outputs.converged != 'true' &&
            needs.round-1.outputs.terminal_status == '') ||
           (needs.seed-resume.result == 'success' &&
            inputs.resume_from_round == '2')) }}
    uses: ./.github/workflows/_create_new_image_rounds.yml
    with:
      round: "2"
      operation: ${{ inputs.operation }}
      max_rounds: ${{ inputs.operation == 'pipeline_smoke' && '0' || '3' }}
      next_round: "3"
      canonical_app: >-
        ${{ inputs.operation == 'existing_as_new_probe' && inputs.app || '' }}
      target_alias: >-
        ${{ inputs.operation == 'existing_as_new_probe' &&
            format('{0}-e2e-test', inputs.app) || '' }}
    secrets:
      DEEPSEEK_API_KEY: >-
        ${{ inputs.operation != 'pipeline_smoke' &&
        secrets.DEEPSEEK_API_KEY || '' }}

  round-3:
    name: "Round 3: validate and fix"
    needs: [round-2, seed-resume]
    if: >-
      ${{ always() &&
          ((needs.round-2.result == 'success' &&
            needs.round-2.outputs.converged != 'true' &&
            needs.round-2.outputs.terminal_status == '') ||
           (needs.seed-resume.result == 'success' &&
            inputs.resume_from_round == '3')) }}
    uses: ./.github/workflows/_create_new_image_rounds.yml
    with:
      round: "3"
      operation: ${{ inputs.operation }}
      max_rounds: ${{ inputs.operation == 'pipeline_smoke' && '0' || '3' }}
      next_round: "4"
      canonical_app: >-
        ${{ inputs.operation == 'existing_as_new_probe' && inputs.app || '' }}
      target_alias: >-
        ${{ inputs.operation == 'existing_as_new_probe' &&
            format('{0}-e2e-test', inputs.app) || '' }}
    secrets:
      DEEPSEEK_API_KEY: >-
        ${{ inputs.operation != 'pipeline_smoke' &&
        secrets.DEEPSEEK_API_KEY || '' }}

  round-4:
    name: "Round 4: validate and fix"
    needs: [round-3, seed-resume]
    if: >-
      ${{ always() &&
          ((needs.round-3.result == 'success' &&
            needs.round-3.outputs.converged != 'true' &&
            needs.round-3.outputs.terminal_status == '') ||
           (needs.seed-resume.result == 'success' &&
            inputs.resume_from_round == '4')) }}
    uses: ./.github/workflows/_create_new_image_rounds.yml
    with:
      round: "4"
      operation: ${{ inputs.operation }}
      max_rounds: ${{ inputs.operation == 'pipeline_smoke' && '0' || '3' }}
      next_round: "5"
      canonical_app: >-
        ${{ inputs.operation == 'existing_as_new_probe' && inputs.app || '' }}
      target_alias: >-
        ${{ inputs.operation == 'existing_as_new_probe' &&
            format('{0}-e2e-test', inputs.app) || '' }}
    secrets:
      DEEPSEEK_API_KEY: >-
        ${{ inputs.operation != 'pipeline_smoke' &&
        secrets.DEEPSEEK_API_KEY || '' }}

  package-candidate:
    name: Seal and publish final candidate
    # A round that passed on both architectures is itself the proof, so the
    # candidate is sealed from whichever round converged.
    if: >-
      ${{ always() &&
          ((needs.round-1.result == 'success' &&
            needs.round-1.outputs.converged == 'true') ||
           (needs.round-2.result == 'success' &&
            needs.round-2.outputs.converged == 'true') ||
           (needs.round-3.result == 'success' &&
            needs.round-3.outputs.converged == 'true') ||
           (needs.round-4.result == 'success' &&
            needs.round-4.outputs.converged == 'true') ||
           inputs.operation == 'resume_package' ||
           inputs.operation == 'recover_package') }}
    needs: [round-1, round-2, round-3, round-4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate source run ID
        if: >-
          ${{ inputs.operation == 'resume_package' ||
              inputs.operation == 'recover_package' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          case "${SOURCE_RUN_ID}" in
            ''|*[!0-9]*|0) echo "source_run_id must be a positive integer" >&2; exit 2 ;;
          esac

      - name: Validate generation run ID
        if: ${{ inputs.operation == 'recover_package' }}
        env:
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          case "${GENERATION_RUN_ID}" in
            ''|*[!0-9]*|0) echo "generation_run_id must be a positive integer" >&2; exit 2 ;;
          esac

      # TODO(test-recovery-cleanup): remove this one-time historical lineage
      # allowlist after the phase-one GitCode PR has been created.
      - name: Confirm reviewed lineage
        if: ${{ inputs.operation == 'recover_package' }}
        env:
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
          VALIDATION_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ "${GENERATION_RUN_ID}" != "30478803960" ] ||
             [ "${VALIDATION_RUN_ID}" != "30483501656" ]; then
            echo "recover_package only accepts the reviewed historical lineage" >&2
            exit 2
          fi

      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up tooling
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          python-version: "3.11"
          arch: x86_64

      - name: Download generation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: >-
            phase1-generation-${{
            inputs.operation == 'recover_package' &&
            inputs.generation_run_id ||
            inputs.operation == 'resume_package' &&
            inputs.source_run_id || github.run_id }}
          path: ${{ runner.temp }}/generation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: >-
            ${{ inputs.operation == 'recover_package' &&
            inputs.generation_run_id ||
            inputs.operation == 'resume_package' &&
            inputs.source_run_id || github.run_id }}

      - name: Download repair evidence (x86_64)
        if: ${{ inputs.operation == 'recover_package' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: >-
            phase1-x86-${{
            (inputs.operation == 'resume_package' ||
            inputs.operation == 'recover_package') &&
            inputs.source_run_id || github.run_id }}
          path: ${{ runner.temp }}/x86
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: >-
            ${{ (inputs.operation == 'resume_package' ||
            inputs.operation == 'recover_package') &&
            inputs.source_run_id || github.run_id }}

      - name: Download final patch and evidence (aarch64)
        if: ${{ inputs.operation == 'recover_package' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: >-
            phase1-arm-${{
            (inputs.operation == 'resume_package' ||
            inputs.operation == 'recover_package') &&
            inputs.source_run_id || github.run_id }}
          path: ${{ runner.temp }}/arm
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: >-
            ${{ (inputs.operation == 'resume_package' ||
            inputs.operation == 'recover_package') &&
            inputs.source_run_id || github.run_id }}

      - name: Download final evidence (x86_64)
        if: ${{ inputs.operation == 'recover_package' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: >-
            phase1-final-x86-${{
            (inputs.operation == 'resume_package' ||
            inputs.operation == 'recover_package') &&
            inputs.source_run_id || github.run_id }}
          path: ${{ runner.temp }}/final-x86
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: >-
            ${{ (inputs.operation == 'resume_package' ||
            inputs.operation == 'recover_package') &&
            inputs.source_run_id || github.run_id }}

      - name: Download converged round candidate
        if: ${{ inputs.operation != 'recover_package' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: >-
            phase1-converged-${{ inputs.operation == 'resume_package' &&
            inputs.source_run_id || github.run_id }}
          path: ${{ runner.temp }}/converged
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: >-
            ${{ inputs.operation == 'resume_package' &&
            inputs.source_run_id || github.run_id }}

      - name: Download round decision evidence
        if: ${{ inputs.operation != 'recover_package' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: >-
            phase1-decide*-${{ inputs.operation == 'resume_package' &&
            inputs.source_run_id || github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/decide-agents
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: >-
            ${{ inputs.operation == 'resume_package' &&
            inputs.source_run_id || github.run_id }}

      - name: Prepare sealing input layout
        if: ${{ inputs.operation != 'recover_package' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/arm/arm-repair-agents" \
            "${RUNNER_TEMP}/final-x86" \
            "${RUNNER_TEMP}/x86/x86-repair-agents"
          cp "${RUNNER_TEMP}/converged/task-spec.json" \
            "${RUNNER_TEMP}/converged/base-sha.txt" \
            "${RUNNER_TEMP}/converged/changes.patch" \
            "${RUNNER_TEMP}/converged/aarch64.json" \
            "${RUNNER_TEMP}/converged/aarch64.junit.xml" \
            "${RUNNER_TEMP}/arm/"
          cp "${RUNNER_TEMP}/converged/x86_64.json" \
            "${RUNNER_TEMP}/converged/x86_64.junit.xml" \
            "${RUNNER_TEMP}/final-x86/"
          if [ -d "${RUNNER_TEMP}/decide-agents" ]; then
            cp -a "${RUNNER_TEMP}/decide-agents/." \
              "${RUNNER_TEMP}/x86/x86-repair-agents/"
          fi

      - name: Verify artifact identity matches
        if: ${{ inputs.operation == 'recover_package' }}
        run: |
          cmp "${RUNNER_TEMP}/generation/task-spec.json" \
            "${RUNNER_TEMP}/x86/task-spec.json"
          cmp "${RUNNER_TEMP}/generation/task-spec.json" \
            "${RUNNER_TEMP}/arm/task-spec.json"
          cmp "${RUNNER_TEMP}/generation/base-sha.txt" \
            "${RUNNER_TEMP}/x86/base-sha.txt"
          cmp "${RUNNER_TEMP}/generation/base-sha.txt" \
            "${RUNNER_TEMP}/arm/base-sha.txt"
          {
            printf '%s  %s\n' \
              3b9579c664c1a699121156d48384d43647a8ac6671490469d1189d788308a56f \
              "${RUNNER_TEMP}/generation/changes.patch"
            printf '%s  %s\n' \
              65682e11649b4e992ee000872317f2b4d04786e1c56a233549dd2c8b2222fc37 \
              "${RUNNER_TEMP}/arm/changes.patch"
            printf '%s  %s\n' \
              afad06c7206854c432cba89c1a19ffd9836a79281763cd1736f01f3e0aae729d \
              "${RUNNER_TEMP}/final-x86/x86_64.json"
            printf '%s  %s\n' \
              8b046be0392a36dccb28b1d14f2c504c5b95fb6e3f518809731639d5e2c7ce86 \
              "${RUNNER_TEMP}/arm/aarch64.json"
          } | sha256sum --check --strict
          "${{ steps.tools.outputs.jq_path }}" -e \
            '.status == "passed" and
             .architecture == "x86_64" and
             .checks == {
               "native_build": true,
               "dgoss": true,
               "shared_tests": true,
               "restart_persistence": true
             }' \
            "${RUNNER_TEMP}/final-x86/x86_64.json" > /dev/null
          "${{ steps.tools.outputs.jq_path }}" -e \
            '.status == "passed" and
             .architecture == "aarch64" and
             .checks == {
               "native_build": true,
               "dgoss": true,
               "shared_tests": true,
               "restart_persistence": true
             }' \
            "${RUNNER_TEMP}/arm/aarch64.json" > /dev/null

      - name: Replay final validated patch
        if: ${{ inputs.operation != 'recover_package' }}
        uses: ./.github/actions/phase1-replay
        with:
          input-dir: ${{ runner.temp }}/arm
          workspace: ${{ runner.temp }}/phase1-target
          base-sha-output: ${{ runner.temp }}/package-base-sha.txt

      - name: Replay recovered patch on target master
        if: ${{ inputs.operation == 'recover_package' }}
        run: |
          clone_result="$(
            "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
              target-clone \
              --source \
                https://gitcode.com/openeuler/openeuler-docker-images.git \
              --destination "${RUNNER_TEMP}/phase1-target" \
              --branch master
          )"
          printf '%s\n' "${clone_result}"
          current_base="$(
            printf '%s\n' "${clone_result}" |
              "${{ steps.tools.outputs.jq_path }}" -r .base_sha
          )"
          validated_base="$(
            tr -d '\n' < "${RUNNER_TEMP}/arm/base-sha.txt"
          )"
          printf '%s\n' "${current_base}" \
            > "${RUNNER_TEMP}/package-base-sha.txt"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            target-apply-recovered-patch \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --branch master \
            --current-base-sha "${current_base}" \
            --validated-base-sha "${validated_base}" \
            --patch "${RUNNER_TEMP}/arm/changes.patch" \
            --output "${RUNNER_TEMP}/recovery-evidence.json"

      - name: Aggregate dual-architecture result evidence
        run: |
          evidence_run_id="${{ github.run_id }}"
          legacy_evidence=""
          if [ "${{ inputs.operation }}" = "recover_package" ]; then
            evidence_run_id="${{ inputs.source_run_id }}"
            # TODO(test-recovery-cleanup): drop with the lineage allowlist.
            # The reviewed run predates validated_patch_sha256; its two report
            # files are already pinned byte-for-byte by SHA256 above.
            legacy_evidence="--allow-legacy-evidence"
          fi
          mkdir -p "${RUNNER_TEMP}/native-reports"
          cp "${RUNNER_TEMP}/final-x86/x86_64.json" \
            "${RUNNER_TEMP}/native-reports/x86_64.json"
          cp "${RUNNER_TEMP}/final-x86/x86_64.junit.xml" \
            "${RUNNER_TEMP}/native-reports/x86_64.junit.xml"
          cp "${RUNNER_TEMP}/arm/aarch64.json" \
            "${RUNNER_TEMP}/native-reports/aarch64.json"
          cp "${RUNNER_TEMP}/arm/aarch64.junit.xml" \
            "${RUNNER_TEMP}/native-reports/aarch64.junit.xml"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/utils/artifacts.py \
            aggregate-native \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --task-spec "${RUNNER_TEMP}/arm/task-spec.json" \
            --run-id "${evidence_run_id}" \
            --run-url \
              "https://github.com/${{ github.repository }}/actions/runs/${evidence_run_id}" \
            --report-dir "${RUNNER_TEMP}/native-reports" \
            ${legacy_evidence}

      - name: Enforce final target gates and lint
        run: |
          evidence_run_id="${{ github.run_id }}"
          legacy_evidence=""
          if [ "${{ inputs.operation }}" = "recover_package" ]; then
            evidence_run_id="${{ inputs.source_run_id }}"
            legacy_evidence="--allow-legacy-evidence"
          fi
          app="$("${{ steps.tools.outputs.jq_path }}" \
            -r .app "${RUNNER_TEMP}/arm/task-spec.json")"
          version="$("${{ steps.tools.outputs.jq_path }}" \
            -r .version "${RUNNER_TEMP}/arm/task-spec.json")"
          os_version="$("${{ steps.tools.outputs.jq_path }}" \
            -r .os_version "${RUNNER_TEMP}/arm/task-spec.json")"
          domain="$("${{ steps.tools.outputs.jq_path }}" \
            -r .domain "${RUNNER_TEMP}/arm/task-spec.json")"
          base_sha="$(
            tr -d '\n' < "${RUNNER_TEMP}/package-base-sha.txt"
          )"
          mkdir -p "${RUNNER_TEMP}/candidate/reports/agents"
          lint_report="${RUNNER_TEMP}/candidate/reports/hadolint.txt"
          lint_status=0
          "${{ steps.tools.outputs.hadolint_path }}" \
            "${RUNNER_TEMP}/phase1-target/${domain}/${app}/${version}/${os_version}/Dockerfile" \
            > "${lint_report}" 2>&1 || lint_status=$?
          cat "${lint_report}"
          printf 'Hadolint advisory exit status: %s\n' "${lint_status}"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/gate_diff.py \
            task-contract \
            --phase final \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --task-spec "${RUNNER_TEMP}/arm/task-spec.json" \
            --base-sha "${base_sha}" \
            --expected-run-id "${evidence_run_id}" \
            ${legacy_evidence} \
            > "${RUNNER_TEMP}/candidate/reports/gates.json"

      - name: Seal immutable candidate bundle
        run: |
          base_sha="$(
            tr -d '\n' < "${RUNNER_TEMP}/package-base-sha.txt"
          )"
          cp "${RUNNER_TEMP}/native-reports/x86_64.json" \
            "${RUNNER_TEMP}/candidate/reports/x86_64.json"
          cp "${RUNNER_TEMP}/native-reports/x86_64.junit.xml" \
            "${RUNNER_TEMP}/candidate/reports/x86_64.junit.xml"
          cp "${RUNNER_TEMP}/native-reports/aarch64.json" \
            "${RUNNER_TEMP}/candidate/reports/aarch64.json"
          cp "${RUNNER_TEMP}/native-reports/aarch64.junit.xml" \
            "${RUNNER_TEMP}/candidate/reports/aarch64.junit.xml"
          cp -a "${RUNNER_TEMP}/generation/generation-reports/." \
            "${RUNNER_TEMP}/candidate/reports/agents/"
          cp -a "${RUNNER_TEMP}/x86/x86-repair-agents/." \
            "${RUNNER_TEMP}/candidate/reports/agents/"
          cp -a "${RUNNER_TEMP}/arm/arm-repair-agents/." \
            "${RUNNER_TEMP}/candidate/reports/agents/"
          cp "${RUNNER_TEMP}/generation/generation-reports/gates.json" \
            "${RUNNER_TEMP}/candidate/reports/generation-gates.json"
          if [ "${{ inputs.operation }}" = "resume_package" ] ||
             [ "${{ inputs.operation }}" = "resume_round" ]; then
            printf \
              '{"mode":"%s","source_run_id":"%s","verification_run_id":"%s","promotable": false}\n' \
              "${{ inputs.operation }}" \
              "${{ inputs.source_run_id }}" \
              "${{ github.run_id }}" \
              > "${RUNNER_TEMP}/candidate/reports/resume-provenance.json"
          fi
          if [ "${{ inputs.operation }}" = "recover_package" ]; then
            # shellcheck disable=SC2016
            "${{ steps.tools.outputs.jq_path }}" \
              --arg generation_run_id "${{ inputs.generation_run_id }}" \
              --arg validation_run_id "${{ inputs.source_run_id }}" \
              --arg packaging_run_id "${{ github.run_id }}" \
              '. + {
                schema_version: 1,
                mode: "recover_package",
                generation_run_id: $generation_run_id,
                validation_run_id: $validation_run_id,
                packaging_run_id: $packaging_run_id,
                promotable: true
              }' \
              "${RUNNER_TEMP}/recovery-evidence.json" \
              > "${RUNNER_TEMP}/candidate/reports/recovery-provenance.json"
          fi
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            target-create-patch \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --branch master \
            --base-sha "${base_sha}" \
            --output "${RUNNER_TEMP}/candidate/changes.patch"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            candidate-create \
            --candidate-dir "${RUNNER_TEMP}/candidate" \
            --task-spec "${RUNNER_TEMP}/arm/task-spec.json" \
            --base-sha "${base_sha}" \
            --validated-run-id "${{ github.run_id }}"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            candidate-verify \
            --candidate-dir "${RUNNER_TEMP}/candidate" \
            --expected-run-id "${{ github.run_id }}"

      - name: Upload immutable candidate
        if: >-
          ${{ inputs.operation != 'resume_package' &&
              inputs.operation != 'resume_round' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: >-
            phase1-${{ inputs.operation == 'pipeline_smoke' &&
            'smoke-' || '' }}candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Upload resumed diagnostic candidate
        if: >-
          ${{ inputs.operation == 'resume_package' ||
              inputs.operation == 'resume_round' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-resume-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Publish validate-only handoff
        if: ${{ inputs.operation == 'validate_only' }}
        run: |
          {
            printf '## Phase-one validate_only passed\n\n'
            printf -- "- Candidate artifact: \`phase1-candidate-%s\`\n" \
              "${{ github.run_id }}"
            printf -- "- Promotion input \`validated_run_id\`: \`%s\`\n" \
              "${{ github.run_id }}"
            printf -- '- No GitCode branch, PR, or Issue was written.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish existing-as-new handoff
        if: ${{ inputs.operation == 'existing_as_new_probe' }}
        env:
          SOURCE_APP: ${{ inputs.app }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            printf '## Existing-as-new test passed\n\n'
            printf -- "- Generated alias: \`%s-e2e-test\`\n" \
              "${SOURCE_APP}"
            printf -- "- Candidate artifact: \`phase1-candidate-%s\`\n" \
              "${RUN_ID}"
            printf -- '- The current run will create a real fork PR.\n'
            printf -- '- This diagnostic PR must not be merged.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish pipeline smoke handoff
        if: ${{ inputs.operation == 'pipeline_smoke' }}
        run: |
          {
            printf '## Pipeline smoke passed\n\n'
            printf -- "- Evidence artifact: \`phase1-smoke-candidate-%s\`\n" \
              "${{ github.run_id }}"
            printf -- '- This synthetic candidate is not promotable.\n'
            printf -- '- No AI or GitCode write API was used.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish resume diagnostic handoff
        if: >-
          ${{ inputs.operation == 'resume_package' ||
              inputs.operation == 'resume_round' }}
        run: |
          {
            printf '## %s diagnostic passed\n\n' "${{ inputs.operation }}"
            printf -- "- Candidate artifact: \`phase1-resume-candidate-%s\`\n" \
              "${{ github.run_id }}"
            printf -- '- This cross-run candidate is diagnostic only.\n'
            printf -- '- Run a fresh validate_only before fork_pr.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish recover handoff
        if: ${{ inputs.operation == 'recover_package' }}
        run: |
          {
            printf '## Recovered package passed\n\n'
            printf -- "- Candidate artifact: \`phase1-candidate-%s\`\n" \
              "${{ github.run_id }}"
            printf -- "- Promotion input \`validated_run_id\`: \`%s\`\n" \
              "${{ github.run_id }}"
            printf -- '- Native validation was reused only after a '
            printf 'non-overlapping target-base advance.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  deliver-fork-pr:
    name: Create fork PR from candidate
    if: >-
      ${{ always() &&
          (inputs.operation == 'fork_pr' ||
           inputs.operation == 'fork_pr_resume' ||
           ((inputs.operation == 'scenario_one' ||
             inputs.operation == 'existing_as_new_probe') &&
            needs.package-candidate.result == 'success')) }}
    needs: [package-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pr_url: ${{ steps.delivery.outputs.pr_url }}
    steps:
      - name: Validate validated run ID
        if: >-
          ${{ inputs.operation == 'fork_pr' ||
              inputs.operation == 'fork_pr_resume' }}
        env:
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
        run: |
          case "${VALIDATED_RUN_ID}" in
            ''|*[!0-9]*|0) echo "validated_run_id must be a positive integer" >&2; exit 2 ;;
          esac

      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up tooling
        uses: ./.github/actions/phase1-setup
        with:
          python-version: "3.11"

      - name: Download validated candidate
        if: ${{ inputs.operation != 'fork_pr_resume' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: >-
            phase1-candidate-${{
            (inputs.operation == 'scenario_one' ||
             inputs.operation == 'existing_as_new_probe') &&
            github.run_id || inputs.validated_run_id }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: >-
            ${{ (inputs.operation == 'scenario_one' ||
                inputs.operation == 'existing_as_new_probe') &&
            github.run_id || inputs.validated_run_id }}

      - name: Download resumed candidate
        if: ${{ inputs.operation == 'fork_pr_resume' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-resume-candidate-${{ inputs.validated_run_id }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.validated_run_id }}

      - name: Promote candidate and create fork PR
        id: delivery
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -o pipefail
          source_issue_args=()
          case "${SOURCE_RUN_ID}" in
            issue:*)
              source_issue_number="${SOURCE_RUN_ID#issue:}"
              source_issue_args=(
                --source-issue-number "${source_issue_number}"
              )
              ;;
          esac
          result_file="${RUNNER_TEMP}/fork-delivery.jsonl"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            fork-deliver \
            --candidate-dir "${RUNNER_TEMP}/candidate" \
            --expected-run-id \
              "${{ (inputs.operation == 'scenario_one' ||
                    inputs.operation == 'existing_as_new_probe') &&
                  github.run_id || inputs.validated_run_id }}" \
            --delivery-run-id "${{ github.run_id }}" \
            --delivery-run-attempt "${{ github.run_attempt }}" \
            --workspace \
              "${RUNNER_TEMP}/promotion-${{ github.run_id }}-${{ github.run_attempt }}" \
            "${source_issue_args[@]}" \
            --gitcode-username qq_42020325 | tee "${result_file}"
          "${RUNNER_TEMP}/phase1-venv/bin/python" - "${result_file}" \
            >> "${GITHUB_OUTPUT}" <<'PY'
          import json
          import sys

          lines = [
              line.strip()
              for line in open(sys.argv[1], encoding="utf-8")
              if line.strip().startswith("{")
          ]
          if not lines:
              raise SystemExit("fork delivery did not emit a JSON result")
          url = str(json.loads(lines[-1]).get("url", ""))
          if not url.startswith("https://gitcode.com/"):
              raise SystemExit("fork delivery did not emit a GitCode PR URL")
          print(f"pr_url={url}")
          PY

  finalize-trigger-issue:
    name: Finalize trigger Issue
    if: >-
      ${{ always() &&
          inputs.operation == 'scenario_one' &&
          startsWith(inputs.source_run_id, 'issue:') }}
    needs:
      - prepare
      - seed-resume
      - round-1
      - round-2
      - round-3
      - round-4
      - package-candidate
      - deliver-fork-pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download needs-human-review evidence
        if: >-
          ${{ (needs.round-1.result == 'success' &&
               needs.round-1.outputs.terminal_status == 'needs-human-review') ||
              (needs.round-2.result == 'success' &&
               needs.round-2.outputs.terminal_status == 'needs-human-review') ||
              (needs.round-3.result == 'success' &&
               needs.round-3.outputs.terminal_status == 'needs-human-review') ||
              (needs.round-4.result == 'success' &&
               needs.round-4.outputs.terminal_status == 'needs-human-review') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-needs-human-${{ github.run_id }}
          path: ${{ runner.temp }}/needs-human

      - name: Report scenario result to source Issue
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          SOURCE_ISSUE: ${{ inputs.source_run_id }}
          OUTCOME: >-
            ${{ needs.deliver-fork-pr.result == 'success' &&
                'success' ||
                ((needs.round-1.result == 'success' &&
                  needs.round-1.outputs.terminal_status ==
                  'needs-human-review') ||
                 (needs.round-2.result == 'success' &&
                  needs.round-2.outputs.terminal_status ==
                  'needs-human-review') ||
                 (needs.round-3.result == 'success' &&
                  needs.round-3.outputs.terminal_status ==
                  'needs-human-review') ||
                 (needs.round-4.result == 'success' &&
                  needs.round-4.outputs.terminal_status ==
                  'needs-human-review')) && 'needs-human-review' || 'failure' }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
                github.run_id }}
          PR_URL: ${{ needs.deliver-fork-pr.outputs.pr_url }}
          FAILURE_SUMMARY: >-
            prepare=${{ needs.prepare.result }},
            round-1=${{ needs.round-1.result }},
            round-2=${{ needs.round-2.result }},
            round-3=${{ needs.round-3.result }},
            round-4=${{ needs.round-4.result }},
            terminal1=${{ needs.round-1.outputs.terminal_status }},
            terminal2=${{ needs.round-2.outputs.terminal_status }},
            terminal3=${{ needs.round-3.outputs.terminal_status }},
            terminal4=${{ needs.round-4.outputs.terminal_status }},
            package=${{ needs.package-candidate.result }},
            delivery=${{ needs.deliver-fork-pr.result }}
        run: |
          python3 scripts/harness/flow.py \
            issue-finalize \
            --target-repo openeuler/openeuler-docker-images \
            --issue-number "${SOURCE_ISSUE#issue:}" \
            --outcome "${OUTCOME}" \
            --run-url "${RUN_URL}" \
            --pr-url "${PR_URL}" \
            --failure-summary "${FAILURE_SUMMARY}" \
            --failure-evidence-dir "${RUNNER_TEMP}/needs-human"

  issue-contract-test:
    name: Test failure Issue lifecycle
    if: ${{ inputs.operation == 'failure_issue_contract_test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up tooling
        uses: ./.github/actions/phase1-setup
        with:
          python-version: "3.11"

      - name: Normalize TaskSpec
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          OS_VERSION: ${{ inputs.os_version }}
          DOMAIN: ${{ inputs.domain }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            task-spec \
            --app "${APP}" \
            --version "${VERSION}" \
            --os-version "${OS_VERSION}" \
            --domain "${DOMAIN}" \
            --source-url "${SOURCE_URL}" \
            --output "${RUNNER_TEMP}/issue-task.json"

      - name: Create, update, comment and close controlled Issue
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            issue-contract-test \
            --task-spec "${RUNNER_TEMP}/issue-task.json" \
            --github-run-id "${{ github.run_id }}" \
            --failure-stage controlled-contract
