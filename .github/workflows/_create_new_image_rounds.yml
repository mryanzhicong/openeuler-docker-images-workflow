name: Phase 1 - Build, test and fix candidate

# One round validates the same candidate on both architectures at once, so
# the round that passes on both is itself the dual-architecture proof.
# Validation must not fail the job: the decide job reads both reports and
# rules on the round, so a failed build still has to publish its evidence.

on:
  workflow_call:
    inputs:
      round:
        description: "Validation round number"
        required: true
        type: string
      operation:
        description: "Phase-one operation being executed"
        required: true
        type: string
      max_rounds:
        description: "Maximum repair rounds"
        required: true
        type: string
      next_round:
        description: >-
          Round that consumes the repaired candidate. Passed explicitly
          because GitHub expressions have no arithmetic operators.
        required: true
        type: string
      canonical_app:
        description: Canonical app for the temporary existing-as-new test
        required: false
        default: ""
        type: string
      target_alias:
        description: Temporary output alias for the existing-as-new test
        required: false
        default: ""
        type: string
    secrets:
      DEEPSEEK_API_KEY:
        # pipeline_smoke converges deterministically and must never repair,
        # so the caller passes no key for that operation.
        required: false
    outputs:
      converged:
        description: "true when both architectures passed on one candidate"
        value: ${{ jobs.decide.outputs.converged }}
      terminal_status:
        description: "needs-human-review or hard-stop terminal outcome"
        value: ${{ jobs.decide.outputs.terminal_status }}

permissions:
  actions: read
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  x86_64:
    name: Validate (x86_64)
    runs-on: [self-hosted, Linux, X64, oe-image-x86]
    timeout-minutes: 180
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Clean native runner before validation (x86_64)
        run: |
          python3 scripts/runner_cleanup.py \
            --workspace "${GITHUB_WORKSPACE}" \
            --job-temp "${RUNNER_TEMP}" \
            --architecture x86_64 \
            --phase before \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --round "${{ inputs.round }}" \
            --runner-name "${{ runner.name }}" \
            --report "${RUNNER_TEMP}/phase1-round/cleanup-before-x86_64.json"

      - name: Set up tooling
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          arch: x86_64
          preflight: "true"
          tool-cache-root: /opt/oe-image-tools

      - name: Download round candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-patch${{ inputs.round }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-input

      - name: Replay round candidate
        id: replay
        uses: ./.github/actions/phase1-replay
        with:
          input-dir: ${{ runner.temp }}/phase1-input
          workspace: ${{ runner.temp }}/phase1-target
          architecture: x86_64
          evidence-dir: ${{ runner.temp }}/phase1-round

      - name: Validate natively (x86_64)
        if: >-
          ${{ steps.replay.outputs.replayed == 'true' &&
              inputs.operation != 'pipeline_smoke' }}
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/phase1-round"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-native-validate \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --task-spec "${RUNNER_TEMP}/phase1-input/task-spec.json" \
            --architecture x86_64 \
            --run-id "${{ github.run_id }}" \
            --dgoss "${{ steps.tools.outputs.dgoss_path }}" \
            --goss "${{ steps.tools.outputs.goss_path }}" \
            --report "${RUNNER_TEMP}/phase1-round/x86_64.json" \
            --junit "${RUNNER_TEMP}/phase1-round/x86_64.junit.xml"

      - name: Run native pipeline smoke (x86_64)
        if: >-
          ${{ steps.replay.outputs.replayed == 'true' &&
              inputs.operation == 'pipeline_smoke' }}
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/phase1-round"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-native-smoke \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --task-spec "${RUNNER_TEMP}/phase1-input/task-spec.json" \
            --architecture x86_64 \
            --run-id "${{ github.run_id }}" \
            --dgoss "${{ steps.tools.outputs.dgoss_path }}" \
            --goss "${{ steps.tools.outputs.goss_path }}" \
            --report "${RUNNER_TEMP}/phase1-round/x86_64.json" \
            --junit "${RUNNER_TEMP}/phase1-round/x86_64.junit.xml" \
            --repair-report-dir "${RUNNER_TEMP}/phase1-round/smoke-agents"

      - name: Clean native runner after validation (x86_64)
        if: ${{ always() }}
        run: |
          python3 scripts/runner_cleanup.py \
            --workspace "${GITHUB_WORKSPACE}" \
            --job-temp "${RUNNER_TEMP}" \
            --architecture x86_64 \
            --phase after \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --round "${{ inputs.round }}" \
            --runner-name "${{ runner.name }}" \
            --report "${RUNNER_TEMP}/phase1-round/cleanup-after-x86_64.json"

      - name: Upload round evidence (x86_64)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-round${{ inputs.round }}-x86_64-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-round/
          if-no-files-found: error
          retention-days: 30

  aarch64:
    name: Validate (aarch64)
    runs-on: [self-hosted, Linux, ARM64, oe-image-arm64]
    timeout-minutes: 180
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Clean native runner before validation (aarch64)
        run: |
          python3 scripts/runner_cleanup.py \
            --workspace "${GITHUB_WORKSPACE}" \
            --job-temp "${RUNNER_TEMP}" \
            --architecture aarch64 \
            --phase before \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --round "${{ inputs.round }}" \
            --runner-name "${{ runner.name }}" \
            --report "${RUNNER_TEMP}/phase1-round/cleanup-before-aarch64.json"

      - name: Set up tooling
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          arch: aarch64
          preflight: "true"
          tool-cache-root: /opt/oe-image-tools

      - name: Download round candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-patch${{ inputs.round }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-input

      - name: Replay round candidate
        id: replay
        uses: ./.github/actions/phase1-replay
        with:
          input-dir: ${{ runner.temp }}/phase1-input
          workspace: ${{ runner.temp }}/phase1-target
          architecture: aarch64
          evidence-dir: ${{ runner.temp }}/phase1-round

      - name: Validate natively (aarch64)
        if: >-
          ${{ steps.replay.outputs.replayed == 'true' &&
              inputs.operation != 'pipeline_smoke' }}
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/phase1-round"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-native-validate \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --task-spec "${RUNNER_TEMP}/phase1-input/task-spec.json" \
            --architecture aarch64 \
            --run-id "${{ github.run_id }}" \
            --dgoss "${{ steps.tools.outputs.dgoss_path }}" \
            --goss "${{ steps.tools.outputs.goss_path }}" \
            --report "${RUNNER_TEMP}/phase1-round/aarch64.json" \
            --junit "${RUNNER_TEMP}/phase1-round/aarch64.junit.xml"

      - name: Run native pipeline smoke (aarch64)
        if: >-
          ${{ steps.replay.outputs.replayed == 'true' &&
              inputs.operation == 'pipeline_smoke' }}
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/phase1-round"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-native-smoke \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --task-spec "${RUNNER_TEMP}/phase1-input/task-spec.json" \
            --architecture aarch64 \
            --run-id "${{ github.run_id }}" \
            --dgoss "${{ steps.tools.outputs.dgoss_path }}" \
            --goss "${{ steps.tools.outputs.goss_path }}" \
            --report "${RUNNER_TEMP}/phase1-round/aarch64.json" \
            --junit "${RUNNER_TEMP}/phase1-round/aarch64.junit.xml" \
            --repair-report-dir "${RUNNER_TEMP}/phase1-round/smoke-agents"

      - name: Clean native runner after validation (aarch64)
        if: ${{ always() }}
        run: |
          python3 scripts/runner_cleanup.py \
            --workspace "${GITHUB_WORKSPACE}" \
            --job-temp "${RUNNER_TEMP}" \
            --architecture aarch64 \
            --phase after \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --round "${{ inputs.round }}" \
            --runner-name "${{ runner.name }}" \
            --report "${RUNNER_TEMP}/phase1-round/cleanup-after-aarch64.json"

      - name: Upload round evidence (aarch64)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-round${{ inputs.round }}-aarch64-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-round/
          if-no-files-found: error
          retention-days: 30

  decide:
    name: Decide round outcome
    needs: [x86_64, aarch64]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      converged: ${{ steps.judge.outputs.converged }}
      terminal_status: ${{ steps.judge.outputs.terminal_status }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up tooling
        id: tools
        uses: ./.github/actions/phase1-setup
        with:
          arch: x86_64

      - name: Apply existing-as-new context
        if: ${{ inputs.canonical_app != '' }}
        uses: ./.github/actions/phase1-existing-as-new-context
        with:
          canonical-app: ${{ inputs.canonical_app }}
          target-alias: ${{ inputs.target_alias }}

      - name: Download round candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-patch${{ inputs.round }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-input

      - name: Download round evidence (x86_64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-round${{ inputs.round }}-x86_64-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-x86

      - name: Download round evidence (aarch64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-round${{ inputs.round }}-aarch64-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-arm

      - name: Verify native runner cleanup evidence
        run: |
          mkdir -p "${RUNNER_TEMP}/phase1-decide"
          status=0
          for specification in \
            "${RUNNER_TEMP}/phase1-x86/cleanup-before-x86_64.json:before:x86_64" \
            "${RUNNER_TEMP}/phase1-x86/cleanup-after-x86_64.json:after:x86_64" \
            "${RUNNER_TEMP}/phase1-arm/cleanup-before-aarch64.json:before:aarch64" \
            "${RUNNER_TEMP}/phase1-arm/cleanup-after-aarch64.json:after:aarch64"
          do
            report="${specification%%:*}"
            remainder="${specification#*:}"
            phase="${remainder%%:*}"
            architecture="${remainder#*:}"
            "${{ steps.tools.outputs.jq_path }}" -e \
              --arg phase "${phase}" \
              --arg architecture "${architecture}" \
              --arg run_id "${{ github.run_id }}" \
              --arg run_attempt "${{ github.run_attempt }}" \
              --arg round "${{ inputs.round }}" \
              '.status == "passed" and .phase == $phase and
               .architecture == $architecture and .run_id == $run_id and
               .run_attempt == $run_attempt and .round == $round and
               (.runner_name | type) == "string" and
               (.runner_name | length) > 0' \
              "${report}" > /dev/null || status=1
          done
          if [ "${status}" -ne 0 ]; then
            printf '%s\n' \
              '{"status":"error","error":"native runner cleanup failed"}' \
              > "${RUNNER_TEMP}/phase1-decide/cleanup-error.json"
            exit 2
          fi

      - name: Replay round candidate
        uses: ./.github/actions/phase1-replay
        with:
          input-dir: ${{ runner.temp }}/phase1-input
          workspace: ${{ runner.temp }}/phase1-target

      - name: Converge or repair
        id: judge
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          base_sha="$(tr -d '\n' \
            < "${RUNNER_TEMP}/phase1-input/base-sha.txt")"
          "${RUNNER_TEMP}/phase1-venv/bin/python" scripts/harness/flow.py \
            phase1-decide \
            --workspace "${RUNNER_TEMP}/phase1-target" \
            --task-spec "${RUNNER_TEMP}/phase1-input/task-spec.json" \
            --base-sha "${base_sha}" \
            --round "${{ inputs.round }}" \
            --max-rounds "${{ inputs.max_rounds }}" \
            --x86-report "${RUNNER_TEMP}/phase1-x86/x86_64.json" \
            --arm-report "${RUNNER_TEMP}/phase1-arm/aarch64.json" \
            --report-dir "${RUNNER_TEMP}/phase1-decide/agents" \
            --opencode "${{ steps.tools.outputs.opencode_path }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Collect converged candidate
        if: ${{ steps.judge.outputs.converged == 'true' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/phase1-converged"
          cp "${RUNNER_TEMP}/phase1-input/task-spec.json" \
            "${RUNNER_TEMP}/phase1-input/base-sha.txt" \
            "${RUNNER_TEMP}/phase1-input/changes.patch" \
            "${RUNNER_TEMP}/phase1-converged/"
          cp "${RUNNER_TEMP}/phase1-x86/x86_64.json" \
            "${RUNNER_TEMP}/phase1-x86/x86_64.junit.xml" \
            "${RUNNER_TEMP}/phase1-arm/aarch64.json" \
            "${RUNNER_TEMP}/phase1-arm/aarch64.junit.xml" \
            "${RUNNER_TEMP}/phase1-converged/"

      - name: Emit next round candidate
        if: >-
          ${{ steps.judge.outputs.converged != 'true' &&
              steps.judge.outputs.terminal_status == '' }}
        uses: ./.github/actions/phase1-emit-patch
        with:
          workspace: ${{ runner.temp }}/phase1-target
          input-dir: ${{ runner.temp }}/phase1-input
          output-dir: ${{ runner.temp }}/phase1-next

      - name: Upload converged candidate
        if: ${{ steps.judge.outputs.converged == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-converged-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-converged/
          if-no-files-found: error
          retention-days: 30

      - name: Upload next round candidate
        if: >-
          ${{ steps.judge.outputs.converged != 'true' &&
              steps.judge.outputs.terminal_status == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-patch${{ inputs.next_round }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-next/
          if-no-files-found: error
          retention-days: 30

      - name: Emit terminal candidate
        if: ${{ steps.judge.outputs.terminal_status != '' }}
        uses: ./.github/actions/phase1-emit-patch
        with:
          workspace: ${{ runner.temp }}/phase1-target
          input-dir: ${{ runner.temp }}/phase1-input
          output-dir: ${{ runner.temp }}/phase1-terminal-candidate

      - name: Download terminal generation evidence
        if: ${{ steps.judge.outputs.terminal_status != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-terminal-generation

      - name: Download round 1 decision evidence
        if: >-
          ${{ steps.judge.outputs.terminal_status != '' && inputs.round > 1 }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-decide1-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-terminal/decisions/round1

      - name: Download round 2 decision evidence
        if: >-
          ${{ steps.judge.outputs.terminal_status != '' && inputs.round > 2 }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-decide2-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-terminal/decisions/round2

      - name: Download round 3 decision evidence
        if: >-
          ${{ steps.judge.outputs.terminal_status != '' && inputs.round > 3 }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-decide3-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-terminal/decisions/round3

      - name: Collect terminal evidence
        if: ${{ steps.judge.outputs.terminal_status != '' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/phase1-terminal/decision" \
            "${RUNNER_TEMP}/phase1-terminal/generation"
          cp "${RUNNER_TEMP}/phase1-terminal-candidate/task-spec.json" \
            "${RUNNER_TEMP}/phase1-terminal-candidate/base-sha.txt" \
            "${RUNNER_TEMP}/phase1-terminal-candidate/changes.patch" \
            "${RUNNER_TEMP}/phase1-x86/x86_64.json" \
            "${RUNNER_TEMP}/phase1-x86/x86_64.junit.xml" \
            "${RUNNER_TEMP}/phase1-arm/aarch64.json" \
            "${RUNNER_TEMP}/phase1-arm/aarch64.junit.xml" \
            "${RUNNER_TEMP}/phase1-terminal/"
          cp -a "${RUNNER_TEMP}/phase1-decide/." \
            "${RUNNER_TEMP}/phase1-terminal/decision/"
          cp -a "${RUNNER_TEMP}/phase1-terminal-generation/generation-reports/." \
            "${RUNNER_TEMP}/phase1-terminal/generation/"

      - name: Upload needs-human-review evidence
        if: ${{ steps.judge.outputs.terminal_status == 'needs-human-review' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-needs-human-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-terminal/
          if-no-files-found: error
          retention-days: 30

      - name: Upload hard-stop evidence
        if: ${{ steps.judge.outputs.terminal_status == 'hard-stop' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-hard-stop-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-terminal/
          if-no-files-found: error
          retention-days: 30

      - name: Upload round decision evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-decide${{ inputs.round }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phase1-decide/
          if-no-files-found: error
          retention-days: 30

      - name: Fail hard-stop decision
        if: ${{ steps.judge.outputs.terminal_status == 'hard-stop' }}
        run: |
          echo "A hard target-contract boundary was violated; evidence was uploaded."
          exit 1
